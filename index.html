<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f7f7;
            margin:2px;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 130vh;
            max-height: 130vh;
            
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            border: 2px solid black;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .input-section {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        .input-section input {
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 20px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        .input-section button {
            padding: 10px;
            background-color: #0fb636;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .input-section button:hover {
            background-color: #218838;
        }

        .summary {
            margin-bottom: 20px;
            padding: 10px;
            background: #f1f1f1;
            border-radius: 5px;
        }

        .summary p {
            margin: 5px 0;
        }

        #transactionList {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 5px;
            overflow-y: scroll;
        }

        #transactionList li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            
        }

        #transactionList li.income {
            background: #d4edda;
            color: #25a714;
        }

        #transactionList li.expense {
            background: #f8d7da;
            color: #721c24;
        }

        .buttons {
            display: flex;
            gap: 5px;
        }

        .buttons button {
            padding: 5px 10px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.9em;
        }

        .edit-btn {
            background-color: #ffc107;
            color: #333;
        }

        .edit-btn:hover {
            background-color: #e0a800;
        }

        .delete-btn {
            background-color: #dc3545;
            color: #fff;
        }

        .delete-btn:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Money Tracker</h1>
        
        <!-- Input Section -->
        <div class="input-section">
            <input type="text" id="description" placeholder="Category (e.g., Rent, Salary)">
            <input type="number" id="amount" placeholder="Amount (e.g., -500, 1000)">
            <input type="date" id="date" placeholder="Date">
            <button id="addTransaction">Add</button>
        </div>

        <!-- Summary Section -->
        <div class="summary">
            <h2>Summary</h2>
            <p>Total Balance: <span id="totalBalance">0 MMK</span></p>
            <p>Total Income: <span id="totalIncome">0 MMK</span></p>
            <p>Total Expense: <span id="totalExpense">0 MMK</span></p>
            <p>Income to Expense Ratio: <span id="incomeExpenseRatio">0%</span></p>
        </div>

        <!-- Transaction List -->
        <ul id="transactionList"></ul>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const descriptionInput = document.getElementById("description");
            const amountInput = document.getElementById("amount");
            const dateInput = document.getElementById("date");
            const addTransactionButton = document.getElementById("addTransaction");
            const transactionList = document.getElementById("transactionList");
            const totalBalance = document.getElementById("totalBalance");
            const totalIncome = document.getElementById("totalIncome");
            const totalExpense = document.getElementById("totalExpense");
            const incomeExpenseRatio = document.getElementById("incomeExpenseRatio");

            let transactions = JSON.parse(localStorage.getItem("transactions")) || [];

            const saveToLocalStorage = () => {
                localStorage.setItem("transactions", JSON.stringify(transactions));
            };

            const updateSummary = () => {
                const income = transactions
                    .filter(txn => txn.amount > 0)
                    .reduce((sum, txn) => sum + txn.amount, 0);

                const expense = transactions
                    .filter(txn => txn.amount < 0)
                    .reduce((sum, txn) => sum + Math.abs(txn.amount), 0);

                const balance = income - expense;
                const ratio = expense > 0 ? ((income / expense) * 100).toFixed(2) : "100.00";

                totalIncome.textContent = `${income.toFixed(2)} MMK`;
                totalExpense.textContent = `${expense.toFixed(2)} MMK`;
                totalBalance.textContent = `${balance.toFixed(2)} MMK`;
                incomeExpenseRatio.textContent = `${ratio}%`;
            };

            const renderTransactions = () => {
                transactionList.innerHTML = "";

                transactions.forEach((txn, index) => {
                    const li = document.createElement("li");
                    li.classList.add(txn.amount > 0 ? "income" : "expense");

                    li.innerHTML = `
                        <div>
                            <strong>${txn.description}</strong> (${txn.date}) - ${txn.amount.toFixed(2)} MMK
                        </div>
                        <div class="buttons">
                            <button class="edit-btn" data-index="${index}">Edit</button>
                            <button class="delete-btn" data-index="${index}">Delete</button>
                        </div>
                    `;

                    li.querySelector(".delete-btn").addEventListener("click", (e) => {
                        const idx = e.target.getAttribute("data-index");
                        transactions.splice(idx, 1);
                        saveToLocalStorage();
                        updateSummary();
                        renderTransactions();
                    });

                    li.querySelector(".edit-btn").addEventListener("click", (e) => {
                        const idx = e.target.getAttribute("data-index");
                        const txn = transactions[idx];

                        descriptionInput.value = txn.description;
                        amountInput.value = txn.amount;
                        dateInput.value = txn.date;

                        transactions.splice(idx, 1);
                        saveToLocalStorage();
                        updateSummary();
                        renderTransactions();
                    });

                    transactionList.appendChild(li);
                });
            };

            addTransactionButton.addEventListener("click", () => {
                const description = descriptionInput.value.trim();
                const amount = parseFloat(amountInput.value);
                const date = dateInput.value || new Date().toISOString().split("T")[0];

                if (description === "" || isNaN(amount)) {
                    alert("Please enter a valid description, amount, and date.");
                    return;
                }

                transactions.push({ description, amount, date });
                saveToLocalStorage();

                descriptionInput.value = "";
                amountInput.value = "";
                dateInput.value = "";

                updateSummary();
                renderTransactions();
            });

            // Initial render
            updateSummary();
            renderTransactions();
        });
    </script>
</body>
</html>
